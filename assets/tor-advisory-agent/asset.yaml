apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: tor-advisory-agent
  version: "1.0.0"

type: agent

container:
  buildPath: .
  port: 5000

provides:
  apis:
    - name: tor-advisory-agent
      kind: a2a
      ordId: customer.build:apiResource:tor-monitor-1fdde.tor-advisory-agent:v1
      description: "Provides expedite/hold/scrap recommendations for near-breach temperature-sensitive pharmaceutical batches"

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
